services:
  n8n:
    image: n8nio/n8n:2.44.6
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
    volumes:
      - C:\VidaVerde\docker\n8n_data:/home/node/.n8n
    restart: unless-stopped